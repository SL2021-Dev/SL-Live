

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartLog Live</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .box {
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        h1 {
            margin-bottom: 10px;
            font-size: 32px;
            letter-spacing: 1px;
        }
        p {
            font-size: 18px;
            margin-top: 0;
        }
        #enable {
            margin-top: 20px;
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }
        #output {
            margin-top: 20px;
            text-align: left;
            font-size: 14px;
            background: #eee;
            padding: 10px;
            border-radius: 8px;
            max-width: 400px;
            overflow-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>SmartLOG Live</h1>
        <p>Coming Soon</p>

        <button id="enable">Enable Push Notifications</button>
        <pre id="output"></pre>
    </div>

<script>
async function registerPush() {
    if (!('serviceWorker' in navigator)) {
        alert("Service workers not supported");
        return;
    }

    // Register service worker
    const reg = await navigator.serviceWorker.register('sw.js');

    // Subscribe to push
    const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: '<YOUR_VAPID_PUBLIC_KEY_BASE64URL>'
    });

    // Show subscription JSON so you can paste it into your server sender
    document.getElementById('output').textContent =
        JSON.stringify(sub, null, 2);
}

document.getElementById('enable').onclick = registerPush;
</script>

</body>
</html>
