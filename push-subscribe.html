<!--
 push-subscribe.html
 Enable push notifications and register with push-server.py
 Served by push-server.py at http://localhost:5000/push-subscribe.html
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartLog Live - Push Subscribe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .box {
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        h1 {
            margin-bottom: 10px;
            font-size: 32px;
            letter-spacing: 1px;
        }
        p {
            font-size: 18px;
            margin-top: 0;
        }
        #enable {
            margin-top: 20px;
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }
        #output {
            margin-top: 20px;
            text-align: left;
            font-size: 14px;
            background: #eee;
            padding: 10px;
            border-radius: 8px;
            max-width: 400px;
            overflow-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>SmartLOG Live</h1>
        <p>Push Notification Subscriber</p>

        <button id="enable">Enable Push Notifications</button>
        <pre id="output"></pre>
    </div>

<script>
// Where push-server.py is currently reachable. Update this when the server
// moves off localhost onto a real host.
const SERVER_URL = 'http://localhost:5000';

async function registerPush() {
    if (!('serviceWorker' in navigator)) {
        alert("Service workers not supported");
        return;
    }

    const reg = await navigator.serviceWorker.register('push-sw.js');

    const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: 'BMjpMIWK9yjiqF4KM2NfL2vxk39Ln6Nq90O1MQXwY992gk3Fm0Au9HveXIUeAF4o_SFREGWRO4KaDKWpjew9c0c'
    });

    // Save any previously issued device_id so re-subscribing reuses the same slot.
    const deviceId = localStorage.getItem('sl_device_id');

    const response = await fetch(SERVER_URL + '/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ device_id: deviceId, subscription: sub })
    });
    const result = await response.json();
    localStorage.setItem('sl_device_id', result.device_id);

    document.getElementById('output').textContent =
        'Subscribed. Your device_id:\n' + result.device_id;
}

document.getElementById('enable').onclick = registerPush;
</script>

</body>
</html>
